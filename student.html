<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>

    <link rel="stylesheet" href="student.css">

</head>
<body>


    <!-- MAIN -->

    <main class="main">

        <header>

            <h1>Welcome, MK</h1>

            <p>Student Dashboard</p>

        </header>

        <!-- PROFILE -->

        <section class="profile">

            <div class="card">

                <h3>Name</h3>

                <p id="studentName">
                    MK
                </p>

            </div>



            <div class="card">

                <h3>Course</h3>

                <p id="course">
                    Computer Science
                </p>

            </div>

            <div class="card">

                <h3>Current Score</h3>

                <p id="score">
                    66.14
                </p>

            </div>

            <div class="card">

                <h3>Admission Status</h3>

                <p id="status">

                    Pending

                </p>

            </div>

        </section>

    </main>

</div>

<script src="student.js"></script>

</body>
</html>
